# LinkedIn Easy Apply Bot Configuration
# =======================================
# Credentials are loaded from .env file (see .env.example)

# Job Search
positions:
  - Software Engineer
  - Software Developer
  - Java Developer
  - Spring Developer
  - GoLang Developer

locations:
  - Bengaluru
  - Remote

salary: 60,000
rate: 25

# AI (Groq)
groq:
  api_key: ""  # Set GROQ_API_KEY in .env instead

# ATS Settings
ats:
  target_score: 80
  min_to_apply: 60
  keywords_to_add: []

# Referral Requests
referral:
  enabled: false
  max_contacts: 3

# Uploads (set RESUME_PATH in .env instead, or use these)
uploads:
  Resume: ""
  Cover Letter: ""

output_filename:
  - output.csv

# Blacklist
# blacklist:
#   - CompanyName

experience_level:
  # - 1 # Entry level
  - 2 # Associate
  - 3 # Mid-Senior level
  # - 4 # Director
  # - 5 # Executive
  # - 6 # Internship